name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR requires the image path to be lowercase (repository_owner is "Bellick-Jiao").
  IMAGE_BASE: ghcr.io/bellick-jiao/integration-hub

jobs:
  # ---------- 1. Build + unit/integration tests (Testcontainers) ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build & test
        working-directory: services
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            services/**/target/surefire-reports
            services/**/target/failsafe-reports

  # ---------- 2. Build images and push to GHCR (main / tag) ----------
  docker:
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [integration-api, profile-service, data-loader]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Package apps (skip tests, build already verified them)
        working-directory: services
        run: mvn -B -ntp -DskipTests package

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:${{ github.ref_name }}
            ${{ env.IMAGE_BASE }}/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 3. kind cluster smoke deploy (main) ----------
  # Boots the full stack in a local Kubernetes (kind): Postgres + Kafka +
  # Keycloak + the three services, then proves the secured end-to-end path:
  # get a Keycloak JWT -> POST a customer -> 202 Accepted -> outbox/relay.
  smoke:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: helm/kind-action@v1
        with:
          cluster_name: hub-smoke

      - name: Deploy manifests
        run: |
          kubectl apply -k k8s/
          kubectl -n hub rollout status statefulset/kafka --timeout=240s
          kubectl -n hub rollout status deployment/keycloak --timeout=300s

      - name: Create Kafka topics
        run: |
          # AUTO_CREATE_TOPICS is off; create the topics like scripts/init-kafka.sh does.
          kubectl -n hub exec kafka-0 -- /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create --if-not-exists \
            --topic customer.profile.events \
            --partitions 3 --replication-factor 1 \
            --config cleanup.policy=compact
          kubectl -n hub exec kafka-0 -- /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 \
            --create --if-not-exists \
            --topic customer.profile.events.dlq \
            --partitions 3 --replication-factor 1

      - name: Wait for services
        run: |
          kubectl -n hub rollout status deployment/integration-api --timeout=240s
          kubectl -n hub rollout status deployment/profile-service --timeout=240s
          kubectl -n hub rollout status deployment/data-loader --timeout=240s

      - name: End-to-end smoke (Keycloak JWT -> POST -> 202)
        run: |
          kubectl -n hub port-forward svc/integration-api 8080:80 &
          kubectl -n hub port-forward svc/keycloak 8088:8080 &
          # Wait for the port-forwards and Keycloak OIDC discovery to come up.
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8088/realms/hub/.well-known/openid-configuration >/dev/null 2>&1 && break
            sleep 2
          done
          # Exchange the demo banker credentials for a JWT (password grant).
          TOKEN=$(curl -fsS -X POST http://localhost:8088/realms/hub/protocol/openid-connect/token \
            -d grant_type=password -d client_id=integration-api \
            -d username=banker -d password=banker-dev | jq -r .access_token)
          test -n "$TOKEN"
          # Health probe is public (no token needed).
          curl -fsS http://localhost:8080/actuator/health
          # Secured write: requires the BANKER role from the JWT.
          curl -fsS -X POST http://localhost:8080/api/v1/customers \
            -H "Authorization: Bearer $TOKEN" \
            -H "Idempotency-Key: smoke-001" \
            -H "Content-Type: application/json" \
            -d '{"customerId":"CUS-SMOKE-1","name":"Smoke Test","email":"smoke@example.com","addresses":[],"kycStatus":"PENDING"}'
