<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event-Driven Integration Hub — POC 架构示意</title>
<style>
  body { margin: 0; padding: 24px; background: #f5f7fa; font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif; }
  .wrap { max-width: 1520px; margin: 0 auto; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px 16px 8px; box-shadow: 0 1px 3px rgba(15,42,74,.06); }
  svg { width: 100%; height: auto; display: block; }
  .foot { color: #64748b; font-size: 12px; padding: 10px 4px 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <svg viewBox="0 0 1500 1155" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Event-Driven Integration Hub 架构示意">
      <defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
        </marker>
        <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
        </marker>
        <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8"/>
        </marker>
      </defs>

      <!-- 标题 -->
      <text x="40" y="42" font-size="24" font-weight="700" fill="#0f2a4a">Event-Driven Integration Hub — POC 架构示意</text>
      <text x="40" y="66" font-size="13" fill="#64748b">面向 BNZ Integration Developer 申请的 Spring Boot + Kafka 个人项目 · 本图为示意，非任何银行内部结构</text>

      <!-- 渠道端 -->
      <rect x="40" y="100" width="300" height="180" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="60" y="132" font-size="16" font-weight="700" fill="#0f2a4a">Channels（渠道端）</text>
      <text x="60" y="160" font-size="13" fill="#334155">Banker Portal / API Clients</text>
      <text x="60" y="184" font-size="13" fill="#334155">认证：OAuth2 JWT（Keycloak）</text>
      <text x="60" y="208" font-size="13" fill="#334155">Header：Idempotency-Key</text>
      <text x="60" y="240" font-size="12" fill="#64748b">客户档案变更请求</text>

      <!-- integration-api -->
      <rect x="420" y="100" width="560" height="180" rx="10" fill="#eaf1f8" stroke="#1e5aa8" stroke-width="2"/>
      <text x="440" y="132" font-size="16" font-weight="700" fill="#0f2a4a">integration-api · Spring Boot 3 + Java 21（:8080）</text>
      <text x="440" y="162" font-size="13" fill="#1e3a5f">REST API · OpenAPI 3 · ProblemDetail（RFC 9457）</text>
      <text x="440" y="186" font-size="13" fill="#1e3a5f">JWT Security · ROLE_BANKER 授权</text>
      <text x="440" y="210" font-size="13" fill="#1e3a5f">Idempotency-Key 幂等重放</text>
      <text x="440" y="234" font-size="13" fill="#1e3a5f">Transactional Outbox（customer + outbox 同事务）</text>
      <text x="440" y="260" font-size="12" fill="#64748b">后台 Outbox Relay 轮询 → 事务性发布</text>

      <!-- Postgres -->
      <rect x="1060" y="100" width="300" height="180" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
      <text x="1080" y="132" font-size="16" font-weight="700" fill="#0b3d78">PostgreSQL 16</text>
      <text x="1080" y="162" font-size="13" fill="#1e3a5f">customer（客户档案）</text>
      <text x="1080" y="186" font-size="13" fill="#1e3a5f">outbox（发件箱）</text>
      <text x="1080" y="210" font-size="13" fill="#1e3a5f">idempotency_keys</text>
      <text x="1080" y="240" font-size="12" fill="#64748b">Flyway 管理 schema 迁移</text>

      <!-- 箭头 ① ② -->
      <line x1="340" y1="155" x2="414" y2="155" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
      <circle cx="352" cy="170" r="10" fill="#0f2a4a"/><text x="352" y="174" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">①</text>
      <text x="330" y="192" font-size="12" fill="#475569">POST /api/v1/customers</text>

      <line x1="980" y1="170" x2="1054" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
      <circle cx="992" cy="185" r="10" fill="#0f2a4a"/><text x="992" y="189" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">②</text>
      <text x="972" y="210" font-size="12" fill="#475569" text-anchor="end">同事务写 customer + outbox</text>

      <!-- Outbox Relay -->
      <rect x="600" y="330" width="300" height="46" rx="23" fill="#fff" stroke="#1d4ed8" stroke-width="1.8"/>
      <text x="750" y="358" font-size="14" font-weight="600" fill="#1d4ed8" text-anchor="middle">Outbox Relay（轮询 · 事务性发布）</text>
      <line x1="700" y1="280" x2="700" y2="324" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
      <circle cx="712" cy="302" r="10" fill="#0f2a4a"/><text x="712" y="306" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">③</text>
      <line x1="700" y1="376" x2="700" y2="414" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

      <!-- Kafka -->
      <rect x="420" y="420" width="640" height="150" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
      <text x="440" y="452" font-size="16" font-weight="700" fill="#8f3b00">Apache Kafka 4.x — KRaft（单节点，无 ZooKeeper）</text>
      <rect x="450" y="466" width="580" height="34" rx="6" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1"/>
      <text x="466" y="488" font-size="13" fill="#5d2a00">customer.profile.events　·　compacted　·　按 customerId 分区（3 partitions，单客户有序）</text>
      <rect x="450" y="506" width="580" height="34" rx="6" fill="#ffccbc" stroke="#bf360c" stroke-width="1"/>
      <text x="466" y="528" font-size="13" fill="#5d2a00">customer.profile.events.dlq　·　死信队列（重试超限后落这里，可重放）</text>
      <text x="440" y="558" font-size="12" fill="#8f3b00">事务性生产者 · enable.idempotence · at-least-once + 消费端幂等 → 逻辑 exactly-once</text>

      <!-- 消费者 -->
      <rect x="180" y="640" width="480" height="180" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
      <text x="200" y="672" font-size="16" font-weight="700" fill="#1b5e20">profile-service · Spring Boot（:8081）</text>
      <text x="200" y="700" font-size="13" fill="#1b5e20">消费组 core-profile-cg（独立消费）</text>
      <text x="200" y="724" font-size="13" fill="#1b5e20">幂等消费：eventId 去重（processed_events）</text>
      <text x="200" y="748" font-size="13" fill="#1b5e20">指数退避重试 → 超限写 DLQ</text>
      <text x="200" y="772" font-size="13" fill="#1b5e20">管理：GET/POST /admin/dlq[/{id}/replay]</text>
      <text x="200" y="800" font-size="12" fill="#3f6212">角色：「核心系统」模拟</text>

      <rect x="840" y="640" width="480" height="180" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8"/>
      <text x="860" y="672" font-size="16" font-weight="700" fill="#1b5e20">data-loader · Spring Boot（:8082）</text>
      <text x="860" y="700" font-size="13" fill="#1b5e20">消费组 data-loader-cg（独立 → 扇出）</text>
      <text x="860" y="724" font-size="13" fill="#1b5e20">Event-carried state transfer（事件带完整快照）</text>
      <text x="860" y="748" font-size="13" fill="#1b5e20">upsert 宽表 snapshot，零回查上游</text>
      <text x="860" y="772" font-size="13" fill="#1b5e20">幂等 + 失败进 DLQ（与 profile-service 一致）</text>
      <text x="860" y="800" font-size="12" fill="#3f6212">角色：「数据平台」模拟</text>

      <!-- 箭头 ④ 扇出 -->
      <line x1="500" y1="570" x2="436" y2="634" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
      <circle cx="452" cy="608" r="10" fill="#0f2a4a"/><text x="452" y="612" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">④</text>
      <line x1="1000" y1="570" x2="1064" y2="634" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
      <circle cx="1048" cy="608" r="10" fill="#0f2a4a"/><text x="1048" y="612" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">④</text>
      <text x="700" y="606" font-size="12" fill="#475569" text-anchor="middle">一份事件 → 两个独立消费组（扇出）</text>

      <!-- 箭头 ⑤ DLQ（走左侧空白区，避免穿过 ④ 标注） -->
      <path d="M 180 740 L 100 740 L 100 523 L 414 523" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrD)"/>
      <circle cx="100" cy="660" r="10" fill="#b45309"/><text x="100" y="664" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">⑤</text>
      <text x="260" y="512" font-size="12" fill="#92400e" text-anchor="middle">重试超限 → 死信队列（可重放）</text>

      <!-- 下游 -->
      <rect x="180" y="880" width="480" height="80" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
      <text x="200" y="912" font-size="15" font-weight="700" fill="#4a148c">Core System（模拟）</text>
      <text x="200" y="936" font-size="13" fill="#4a148c">profile_store：最新客户档案</text>
      <rect x="840" y="880" width="480" height="80" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="1.5"/>
      <text x="860" y="912" font-size="15" font-weight="700" fill="#4a148c">Data Platform（模拟）</text>
      <text x="860" y="936" font-size="13" fill="#4a148c">data_warehouse：分析宽表</text>

      <line x1="420" y1="820" x2="420" y2="874" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
      <circle cx="432" cy="852" r="10" fill="#0f2a4a"/><text x="432" y="856" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">⑥</text>
      <line x1="1080" y1="820" x2="1080" y2="874" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
      <circle cx="1068" cy="852" r="10" fill="#0f2a4a"/><text x="1068" y="856" font-size="11" fill="#fff" text-anchor="middle" font-weight="700">⑥</text>

      <!-- 横切 -->
      <rect x="40" y="1000" width="440" height="92" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
      <text x="60" y="1030" font-size="15" font-weight="700" fill="#7a5900">Security</text>
      <text x="60" y="1054" font-size="12.5" fill="#5f4700">Keycloak 26 OIDC · JWKS 校验 JWT</text>
      <text x="60" y="1074" font-size="12.5" fill="#5f4700">ROLE_BANKER · 日志 PII 掩码 · mTLS 扩展（文档化）</text>

      <rect x="530" y="1000" width="440" height="92" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
      <text x="550" y="1030" font-size="15" font-weight="700" fill="#7a5900">Observability</text>
      <text x="550" y="1054" font-size="12.5" fill="#5f4700">JSON 结构化日志（traceId/eventId）</text>
      <text x="550" y="1074" font-size="12.5" fill="#5f4700">Prometheus 指标 · Zipkin 追踪 · 健康/就绪探针</text>

      <rect x="1020" y="1000" width="440" height="92" rx="10" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
      <text x="1040" y="1030" font-size="15" font-weight="700" fill="#7a5900">CI/CD &amp; Deploy</text>
      <text x="1040" y="1054" font-size="12.5" fill="#5f4700">GitHub Actions → Testcontainers → GHCR 镜像</text>
      <text x="1040" y="1074" font-size="12.5" fill="#5f4700">kind 集群冒烟 · K8s 清单 · OpenShift 兼容（非 root）</text>

      <!-- 图例 -->
      <text x="40" y="1128" font-size="12.5" fill="#475569">
        图例：<tspan font-weight="700">━━━</tspan> 数据流　　<tspan font-weight="700" fill="#b45309">┅┅</tspan> 失败/DLQ 路径　　<tspan>① 提交变更 → ② 同事务落库+发件箱 → ③ 发布事件 → ④ 扇出消费 → ⑤ 失败进 DLQ → ⑥ 落库下游</tspan>
      </text>
      <text x="40" y="1150" font-size="12" fill="#94a3b8">示意：组件与流程为个人 POC 的简化表达，不代表任何银行的实际系统结构。</text>
    </svg>
    <div class="foot">Event-Driven Integration Hub · 架构示意图（静态 SVG，可直接用于 README 或简历展示）</div>
  </div>
</div>
</body>
</html>
