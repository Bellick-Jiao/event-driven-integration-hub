<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>

  <text x="580" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Event-Driven Integration Hub — high-level architecture</text>

  <!-- API clients -->
  <rect x="80" y="80" width="220" height="56" rx="8" fill="#f5f5f5" stroke="#666"/>
  <text x="190" y="105" text-anchor="middle" fill="#222">API Clients</text>
  <text x="190" y="122" text-anchor="middle" fill="#555" font-size="11">(Banker Portal / Callers)</text>

  <!-- integration-api -->
  <rect x="80" y="210" width="220" height="90" rx="8" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="190" y="235" text-anchor="middle" font-weight="bold" fill="#1a3a5c">integration-api :8080</text>
  <text x="190" y="255" text-anchor="middle" fill="#333" font-size="11">REST · Idempotency-Key</text>
  <text x="190" y="272" text-anchor="middle" fill="#333" font-size="11">Transactional Outbox (write side)</text>

  <!-- Postgres outbox (cylinder) -->
  <g>
    <ellipse cx="190" cy="390" rx="100" ry="12" fill="#f5f5f5" stroke="#666"/>
    <path d="M90,390 L90,450 Q90,462 190,462 Q290,462 290,450 L290,390" fill="#f5f5f5" stroke="#666"/>
    <ellipse cx="190" cy="390" rx="100" ry="12" fill="none" stroke="#666"/>
    <text x="190" y="415" text-anchor="middle" font-size="11" fill="#333">Postgres — hub DB</text>
    <text x="190" y="432" text-anchor="middle" font-size="10" fill="#555">customer · outbox · idempotency_keys</text>
  </g>

  <!-- Kafka -->
  <rect x="470" y="210" width="200" height="90" rx="8" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="570" y="235" text-anchor="middle" font-weight="bold" fill="#7a5200">Apache Kafka (KRaft)</text>
  <text x="570" y="255" text-anchor="middle" font-size="11" fill="#5c3d00">topic: customer.profile.events</text>
  <text x="570" y="272" text-anchor="middle" font-size="11" fill="#5c3d00">compacted · keyed by customerId</text>

  <!-- Outbox relay (dashed) -->
  <rect x="360" y="345" width="180" height="50" rx="6" fill="#ffffff" stroke="#6c8ebf" stroke-dasharray="5,4"/>
  <text x="450" y="365" text-anchor="middle" font-size="11" fill="#1a3a5c">OutboxRelay (@Scheduled)</text>
  <text x="450" y="382" text-anchor="middle" font-size="10" fill="#555">PENDING → publish → PUBLISHED</text>

  <!-- profile-service -->
  <rect x="820" y="130" width="230" height="80" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="935" y="155" text-anchor="middle" font-weight="bold" fill="#2d5a1e">profile-service :8081</text>
  <text x="935" y="175" text-anchor="middle" font-size="11" fill="#333">group: profile-service-group</text>
  <text x="935" y="192" text-anchor="middle" font-size="11" fill="#333">idempotent · retry → DLQ → replay</text>

  <!-- data-loader -->
  <rect x="820" y="300" width="230" height="80" rx="8" fill="#d5e8d4" stroke="#82b366"/>
  <text x="935" y="325" text-anchor="middle" font-weight="bold" fill="#2d5a1e">data-loader :8082</text>
  <text x="935" y="345" text-anchor="middle" font-size="11" fill="#333">group: data-loader-group</text>
  <text x="935" y="362" text-anchor="middle" font-size="11" fill="#333">fan-out · idempotent wide-table load</text>

  <!-- Postgres profile -->
  <g>
    <ellipse cx="935" cy="455" rx="80" ry="11" fill="#f5f5f5" stroke="#666"/>
    <path d="M855,455 L855,510 Q855,521 935,521 Q1015,521 1015,510 L1015,455" fill="#f5f5f5" stroke="#666"/>
    <ellipse cx="935" cy="455" rx="80" ry="11" fill="none" stroke="#666"/>
    <text x="935" y="478" text-anchor="middle" font-size="10" fill="#333">Postgres · schema: profile_service</text>
    <text x="935" y="494" text-anchor="middle" font-size="9" fill="#555">profile_store · processed_events · dlq_events</text>
  </g>

  <!-- Postgres warehouse -->
  <g>
    <ellipse cx="935" cy="565" rx="80" ry="10" fill="#f5f5f5" stroke="#666"/>
    <path d="M855,565 L855,615 Q855,625 935,625 Q1015,625 1015,615 L1015,565" fill="#f5f5f5" stroke="#666"/>
    <ellipse cx="935" cy="565" rx="80" ry="10" fill="none" stroke="#666"/>
    <text x="935" y="586" text-anchor="middle" font-size="10" fill="#333">Postgres · schema: data_loader</text>
    <text x="935" y="601" text-anchor="middle" font-size="9" fill="#555">data_warehouse · processed_events</text>
  </g>

  <!-- Cross-cutting -->
  <rect x="120" y="560" width="170" height="46" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="205" y="588" text-anchor="middle" font-size="11" fill="#3d2b4a">Keycloak (OIDC / JWT)</text>

  <rect x="330" y="560" width="160" height="46" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="410" y="588" text-anchor="middle" font-size="11" fill="#3d2b4a">Prometheus (metrics)</text>

  <rect x="520" y="560" width="170" height="46" rx="8" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="605" y="588" text-anchor="middle" font-size="11" fill="#3d2b4a">Zipkin (distributed tracing)</text>

  <!-- Edges -->
  <line x1="190" y1="136" x2="190" y2="210" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="178" font-size="10" fill="#555">POST /api/v1/customers</text>

  <line x1="190" y1="300" x2="190" y2="380" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="345" font-size="10" fill="#555">customer + outbox (same tx)</text>

  <path d="M300,255 L470,255" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="310" y="248" font-size="10" fill="#555">relay: transactional producer</text>

  <path d="M540,345 L540,300" stroke="#999" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowDash)"/>

  <path d="M670,235 L820,175" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="690" y="195" font-size="10" fill="#555">fan-out</text>

  <path d="M670,285 L820,340" stroke="#555" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="690" y="320" font-size="10" fill="#555">fan-out</text>

  <path d="M935,210 L935,444" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>
  <path d="M935,380 L935,554" stroke="#555" stroke-width="1.2" fill="none" marker-end="url(#arrow)"/>

  <path d="M205,560 L205,300" stroke="#9673a6" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowDash)"/>
  <text x="120" y="540" font-size="10" fill="#9673a6">JWT</text>

  <path d="M410,560 L300,300" stroke="#9673a6" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowDash)"/>
  <text x="330" y="470" font-size="10" fill="#9673a6">/actuator/prometheus</text>

  <path d="M605,560 L605,300" stroke="#9673a6" stroke-width="1.2" stroke-dasharray="5,4" fill="none" marker-end="url(#arrowDash)"/>
  <text x="612" y="440" font-size="10" fill="#9673a6">traceId</text>
</svg>
