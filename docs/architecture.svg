<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="800" y="52" text-anchor="middle" font-size="38" font-weight="bold" fill="#222">Event-Driven Integration Hub — Architecture</text>

  <!-- API Clients -->
  <rect x="60" y="230" width="200" height="110" rx="12" fill="#f5f5f5" stroke="#666"/>
  <text x="160" y="278" text-anchor="middle" font-size="26" font-weight="bold" fill="#222">API Clients</text>
  <text x="160" y="314" text-anchor="middle" font-size="20" fill="#555">Banker Portal</text>

  <!-- integration-api -->
  <rect x="360" y="190" width="260" height="170" rx="12" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="490" y="238" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a3a5c">integration-api</text>
  <text x="490" y="270" text-anchor="middle" font-size="20" fill="#333">REST API (:8080)</text>
  <text x="490" y="300" text-anchor="middle" font-size="20" fill="#333">Idempotency-Key</text>
  <text x="490" y="330" text-anchor="middle" font-size="20" fill="#333">Transactional Outbox</text>

  <!-- hub Postgres -->
  <g>
    <ellipse cx="490" cy="470" rx="120" ry="18" fill="#f5f5f5" stroke="#666"/>
    <path d="M370,470 L370,580 Q370,598 490,598 Q610,598 610,580 L610,470" fill="#f5f5f5" stroke="#666"/>
    <ellipse cx="490" cy="470" rx="120" ry="18" fill="none" stroke="#666"/>
    <text x="490" y="515" text-anchor="middle" font-size="21" fill="#333">Postgres — hub DB</text>
    <text x="490" y="548" text-anchor="middle" font-size="17" fill="#555">customer · outbox</text>
    <text x="490" y="572" text-anchor="middle" font-size="17" fill="#555">idempotency_keys</text>
  </g>

  <!-- Outbox relay -->
  <rect x="690" y="470" width="150" height="90" rx="10" fill="#ffffff" stroke="#6c8ebf" stroke-dasharray="8,6"/>
  <text x="765" y="510" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a3a5c">Outbox Relay</text>
  <text x="765" y="538" text-anchor="middle" font-size="16" fill="#555">PENDING →</text>
  <text x="765" y="558" text-anchor="middle" font-size="16" fill="#555">PUBLISHED</text>

  <!-- Kafka -->
  <rect x="700" y="190" width="260" height="170" rx="12" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="830" y="238" text-anchor="middle" font-size="26" font-weight="bold" fill="#7a5200">Apache Kafka</text>
  <text x="830" y="272" text-anchor="middle" font-size="20" fill="#5c3d00">customer.profile.events</text>
  <text x="830" y="302" text-anchor="middle" font-size="18" fill="#5c3d00">keyed by customerId</text>
  <text x="830" y="332" text-anchor="middle" font-size="18" fill="#5c3d00">KRaft · no ZooKeeper</text>

  <!-- profile-service -->
  <rect x="1090" y="150" width="280" height="150" rx="12" fill="#d5e8d4" stroke="#82b366"/>
  <text x="1230" y="196" text-anchor="middle" font-size="25" font-weight="bold" fill="#2d5a1e">profile-service</text>
  <text x="1230" y="228" text-anchor="middle" font-size="18" fill="#333">profile-service-group</text>
  <text x="1230" y="258" text-anchor="middle" font-size="18" fill="#333">idempotent · retry/backoff</text>
  <text x="1230" y="286" text-anchor="middle" font-size="18" fill="#333">DLQ → replay</text>

  <!-- data-loader -->
  <rect x="1090" y="390" width="280" height="150" rx="12" fill="#d5e8d4" stroke="#82b366"/>
  <text x="1230" y="436" text-anchor="middle" font-size="25" font-weight="bold" fill="#2d5a1e">data-loader</text>
  <text x="1230" y="468" text-anchor="middle" font-size="18" fill="#333">data-loader-group</text>
  <text x="1230" y="498" text-anchor="middle" font-size="18" fill="#333">event-carried state</text>
  <text x="1230" y="526" text-anchor="middle" font-size="18" fill="#333">wide-table load</text>

  <!-- consumer Postgres (vertical, to the right) -->
  <g>
    <ellipse cx="1495" cy="220" rx="65" ry="16" fill="#f5f5f5" stroke="#666"/>
    <path d="M1430,220 L1430,520 Q1430,536 1495,536 Q1560,536 1560,520 L1560,220" fill="#f5f5f5" stroke="#666"/>
    <ellipse cx="1495" cy="220" rx="65" ry="16" fill="none" stroke="#666"/>
    <text x="1495" y="262" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">Postgres</text>
    <text x="1495" y="292" text-anchor="middle" font-size="14" fill="#555">schemas:</text>
    <text x="1495" y="316" text-anchor="middle" font-size="14" fill="#333">profile_service</text>
    <text x="1495" y="340" text-anchor="middle" font-size="14" fill="#333">data_loader</text>
    <text x="1495" y="376" text-anchor="middle" font-size="13" fill="#555">processed_events</text>
    <text x="1495" y="400" text-anchor="middle" font-size="13" fill="#555">dlq_events</text>
  </g>

  <!-- Cross-cutting band -->
  <rect x="60" y="830" width="1480" height="90" rx="12" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="800" y="868" text-anchor="middle" font-size="21" font-weight="bold" fill="#3d2b4a">Cross-cutting across all services</text>
  <text x="800" y="900" text-anchor="middle" font-size="19" fill="#3d2b4a">Keycloak OIDC/JWT  ·  Prometheus metrics (/actuator/prometheus)  ·  Zipkin distributed tracing (traceId)  ·  structured JSON logs with correlation IDs</text>

  <!-- Edges -->
  <line x1="260" y1="285" x2="356" y2="285" stroke="#444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="300" y="265" text-anchor="middle" font-size="16" fill="#444">POST /customers</text>

  <line x1="490" y1="360" x2="490" y2="448" stroke="#444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="610" y="410" text-anchor="middle" font-size="17" fill="#444">customer + outbox</text>
  <text x="610" y="432" text-anchor="middle" font-size="17" fill="#444">(single transaction)</text>

  <line x1="610" y1="520" x2="686" y2="520" stroke="#444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="765" y1="470" x2="800" y2="364" stroke="#444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="852" y="430" text-anchor="middle" font-size="16" fill="#444">transactional</text>
  <text x="852" y="450" text-anchor="middle" font-size="16" fill="#444">producer</text>

  <path d="M960,250 L1086,225" stroke="#444" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M960,310 L1086,465" stroke="#444" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1024" y="200" text-anchor="middle" font-size="16" fill="#444">fan-out</text>
  <text x="1024" y="392" text-anchor="middle" font-size="16" fill="#444">fan-out</text>

  <line x1="1370" y1="230" x2="1426" y2="278" stroke="#444" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1370" y1="465" x2="1426" y2="430" stroke="#444" stroke-width="2.5" marker-end="url(#arrow)"/>
</svg>
