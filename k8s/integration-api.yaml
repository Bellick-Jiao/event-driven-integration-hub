# integration-api — channel-facing REST API (outbox write side, JWT-secured).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-api
  labels:
    app: integration-api
spec:
  # One replica is enough for the smoke cluster; production would run 2+ and
  # let the HPA below scale on CPU.
  replicas: 1
  selector:
    matchLabels: { app: integration-api }
  template:
    metadata:
      labels: { app: integration-api }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: integration-api
          image: ghcr.io/bellick-jiao/integration-hub/integration-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8080 }
          envFrom:
            - configMapRef: { name: hub-config }
            - secretRef: { name: hub-secrets }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: 1, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: integration-api
  labels:
    app: integration-api
spec:
  selector:
    app: integration-api
  ports:
    - { port: 80, targetPort: 8080 }
---
# Scales on CPU. NOTE: requires the metrics-server add-on in the cluster;
# without it the HPA is admitted but stays at minReplicas (harmless for smoke).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: integration-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: integration-api
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
