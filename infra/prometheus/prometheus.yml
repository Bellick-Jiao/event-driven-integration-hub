# Prometheus scrape config for the observability profile
# (docker compose --profile observability up -d).
#
# Services run on the host JVM during local development, so Prometheus (in a
# container) reaches them via host.docker.internal.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: integration-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: profile-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]

  - job_name: data-loader
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
