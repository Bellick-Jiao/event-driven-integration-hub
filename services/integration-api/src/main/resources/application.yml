spring:
  application:
    name: integration-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hub}
    username: ${DB_USER:hub}
    password: ${DB_PASSWORD:hub-dev}

  jpa:
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway; JPA only validates
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  # M4 security: JWT tokens are issued by Keycloak and validated via OIDC
  # discovery (issuer-uri). Override with KEYCLOAK_ISSUER_URI in k8s / compose.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/hub}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Transactional producer: outbox relay publishes each batch in one
      # Kafka transaction with idempotence enabled (design.md §9).
      transaction-id-prefix: hub-tx-
      enable-idempotence: true
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  jackson:
    time-zone: UTC

hub:
  relay:
    enabled: true
    poll-interval-ms: 5000
    batch-size: 50
    topic: customer.profile.events

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  # M3 observability: sample 100% in this demo, ship spans to Zipkin.
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.bellick.hub: INFO
