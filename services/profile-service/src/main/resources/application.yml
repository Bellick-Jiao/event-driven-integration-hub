spring:
  application:
    name: profile-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hub}
    username: ${DB_USER:hub}
    password: ${DB_PASSWORD:hub-dev}

  jpa:
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway; JPA only validates
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: profile-service-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 300000
    listener:
      # Manual ACK per record: DB commit happens first, then the offset is
      # committed. Redelivery after a crash is handled by idempotency.
      ack-mode: record

  jackson:
    time-zone: UTC

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

hub:
  kafka:
    topic: customer.profile.events
    dlq-topic: customer.profile.events.dlq
    max-attempts: 3
    backoff-interval-ms: 1000

logging:
  level:
    com.bellick.hub: INFO
