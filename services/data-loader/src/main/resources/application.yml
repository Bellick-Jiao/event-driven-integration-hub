spring:
  application:
    name: data-loader

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hub}
    username: ${DB_USER:hub}
    password: ${DB_PASSWORD:hub-dev}

  # This service owns its OWN schema on the shared Postgres instance.
  # Each service keeps its own flyway_schema_history, so V1__init.sql files
  # with the same version number never collide (multi-service Flyway rule).
  flyway:
    enabled: true
    schemas: data_loader
    default-schema: data_loader

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: data_loader
        jdbc:
          time_zone: UTC

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: data-loader-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

  jackson:
    time-zone: UTC

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  # M3 observability: sample 100% in this demo, ship spans to Zipkin.
  tracing:
    sampling:
      probability: 1.0

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

hub:
  kafka:
    topic: customer.profile.events

logging:
  level:
    com.bellick.hub: INFO
